 #─────────────────────────────────────────────────────────────────────────────
# CompanyOS — application.properties
#
# IMPORTANT: No secrets live in this file.
# All sensitive values are read from environment variables at startup.
# Set the required variables before running the application.
# See .env.example at the repository root for the full list.
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=backend

# Load local .env files when present. Environment variables still take precedence.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/companyos
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# ddl-auto=update: Hibernate adds new columns / tables automatically.
# Never use create or create-drop in production — data will be wiped.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Gmail SMTP ────────────────────────────────────────────────────────────────
# MAIL_USERNAME must be a full Gmail address: yourname@gmail.com
# MAIL_PASSWORD must be a Google App Password (16 chars, no spaces).
# Steps to generate an App Password:
#   1. Enable 2-Step Verification on the Gmail account.
#   2. Google Account → Security → App Passwords.
#   3. Select "Mail" and generate — copy the 16-character password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── JWT ───────────────────────────────────────────────────────────────────────
# JWT_SECRET must be at least 32 characters.
# Generate a strong one: openssl rand -base64 48
jwt.secret=${JWT_SECRET:default-companyos-dev-jwt-secret-key-32-chars-minimum!}

# ── Google OAuth 2.0 / OpenID Connect ────────────────────────────────────────
# GOOGLE_CLIENT_ID  — the OAuth 2.0 client ID from Google Cloud Console.
#                     Also embedded in the frontend (VITE_GOOGLE_CLIENT_ID) because
#                     the client ID is public. The client SECRET is never in the frontend.
# GOOGLE_CLIENT_SECRET — kept strictly server-side. Not used for ID-token verification
#                        (that uses Google's public keys), but required for token exchange
#                        in Authorization Code flows if needed in future.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

